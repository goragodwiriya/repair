<aside data-component="sidebar"></aside>
<div class="main-content">
  <div>
    <header data-component="topbar"></header>
    <main class="content">
      <form data-form="repairStatuses" action="api/repair/statuses/save" method="post" data-ajax-submit="true" data-load-api="api/repair/statuses/get"
            data-confirm="Confirm save" autocomplete="off">
        <div class="card-groups">
          <header>
            <div>
              <h1 class="icon-star0" data-i18n>{LNG_Repair status}</h1>
              <p data-i18n>{LNG_Details of} {LNG_Repair status}</p>
            </div>
          </header>
          <div class="content-body">
            <fieldset class="grid">
              <div class="tablebody">
                <table class="table border fullwidth" data-table="repairStatuses" data-editable-rows="true" data-attr="data:options" data-dynamic-columns="true">
                  <tbody></tbody>
                </table>
              </div>
              <div class="comment" data-i18n>{LNG_Initial repair status}</div>
            </fieldset>
            <fieldset class="submit">
              <button type="submit" class="btn btn-primary icon-save" data-i18n>{LNG_Save}</button>
            </fieldset>
          </div>
        </div>
      </form>
    </main>
  </div>
  <footer class="footer">
    <p class="center">&copy; 2026 Now.js - <a href="https://nowjs.net">nowjs.net</a></p>
  </footer>
</div>
