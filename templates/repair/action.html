<form data-form="repairAction" action="api/repair/action/save" method="post" data-ajax-submit="true" data-validate="false" data-reset="false" autocomplete="off">
  <fieldset>
    <div>
      <label for="status" data-i18n>{LNG_Repair status}</label>
      <span class="form-control icon-star0">
        <select id="status" name="status" data-options-key="status" data-attr="value:status"></select>
      </span>
    </div>
    <div data-if="is_manager == 1">
      <label for="operator_id" data-i18n>{LNG_Operator}</label>
      <span class="form-control icon-customer">
        <select id="operator_id" name="operator_id" data-options-key="operator_id" data-attr="value:operator_id"></select>
      </span>
    </div>
    <div>
      <label for="comment" data-i18n>{LNG_Comment}</label>
      <span class="form-control icon-comments">
        <textarea id="comment" name="comment" rows="5" data-text="comment"></textarea>
      </span>
      <div class="comment" data-i18n>{LNG_Note or additional notes}</div>
    </div>
    <div>
      <label for="cost" data-i18n>{LNG_Cost}</label>
      <span class="form-control icon-money">
        <input type="number" id="cost" name="cost" data-attr="value:cost" min="0" step="0.01">
      </span>
      <div class="comment" data-i18n>{LNG_Fill in the repair costs you want to inform the customer}</div>
    </div>
  </fieldset>
  <fieldset class="submit right">
    <button type="submit" class="btn btn-primary icon-save" data-i18n>{LNG_Save}</button>
    <input type="hidden" name="repair_id" data-attr="value:repair_id">
  </fieldset>
</form>
